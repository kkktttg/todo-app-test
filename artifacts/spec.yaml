version: 1

scenarios:
  # === 칼럼 관리 ===
  - id: "KANBAN-001"
    name: "기본 칼럼 초기 표시"
    given: "사용자가 앱에 처음 접속한 상태"
    when: "칸반 보드 페이지가 로드된다"
    then: "기본 칼럼 3개가 순서대로 표시된다"
    examples:
      - input: {}
        expect:
          columns: ["Todo", "In Progress", "Done"]
          columnCount: 3

  - id: "KANBAN-002"
    name: "칼럼 추가"
    given: "기본 칼럼 3개가 표시된 칸반 보드"
    when: "'칼럼 추가' 버튼을 클릭하고 'QA'를 입력한다"
    then: "4번째 칼럼 'QA'가 보드에 표시된다"
    examples:
      - input: { columnName: "QA" }
        expect:
          columns: ["Todo", "In Progress", "Done", "QA"]
          columnCount: 4

  - id: "KANBAN-003"
    name: "칼럼 이름 변경"
    given: "'In Progress' 칼럼이 표시된 칸반 보드"
    when: "'In Progress' 칼럼 헤더를 클릭하고 '진행 중'으로 수정한다"
    then: "칼럼 헤더가 '진행 중'으로 표시된다"
    examples:
      - input: { targetColumn: "In Progress", newName: "진행 중" }
        expect:
          columnHeader: "진행 중"

  - id: "KANBAN-004"
    name: "빈 칼럼 삭제"
    given: "카드가 없는 'Done' 칼럼이 표시된 칸반 보드"
    when: "'Done' 칼럼의 '삭제' 버튼을 클릭한다"
    then: "'Done' 칼럼이 사라지고 칼럼이 2개로 줄어든다"
    examples:
      - input: { targetColumn: "Done" }
        expect:
          columnCount: 2
          doneColumnVisible: false

  - id: "KANBAN-005"
    name: "카드가 있는 칼럼 삭제 시 확인"
    given: "카드 2개가 있는 'Todo' 칼럼이 표시된 칸반 보드"
    when: "'Todo' 칼럼의 '삭제' 버튼을 클릭한다"
    then: "확인 다이얼로그가 표시된다"
    examples:
      - input: { targetColumn: "Todo" }
        expect:
          confirmDialogVisible: true

  - id: "KANBAN-044"
    name: "카드가 있는 칼럼 삭제 확인 후 실행"
    given: "카드 2개가 있는 'Todo' 칼럼의 삭제 확인 다이얼로그가 표시된 상태"
    when: "확인 다이얼로그에서 '확인'을 클릭한다"
    then: "'Todo' 칼럼과 포함된 카드가 모두 삭제되고 칼럼이 2개로 줄어든다"
    examples:
      - input: { targetColumn: "Todo", confirmDelete: true }
        expect:
          columnCount: 2
          todoColumnVisible: false

  # === 카드 생성 ===
  - id: "KANBAN-006"
    name: "카드 생성 - 기본 필드"
    given: "'Todo' 칼럼이 표시된 칸반 보드"
    when: "'Todo' 칼럼의 '추가' 버튼을 클릭하고 제목과 설명을 입력한다"
    then: "'Todo' 칼럼에 새 카드가 표시된다"
    examples:
      - input: { title: "API 설계", description: "REST 엔드포인트 정의", column: "Todo" }
        expect:
          cardTitle: "API 설계"
          cardDescription: "REST 엔드포인트 정의"
          cardVisible: true

  - id: "KANBAN-007"
    name: "카드 생성 - 제목 없이 시도"
    given: "카드 추가 폼이 열린 상태"
    when: "제목을 비워두고 생성을 시도한다"
    then: "오류 메시지가 표시된다"
    examples:
      - input: { title: "" }
        expect:
          errorMessage: "제목을 입력해주세요"

  - id: "KANBAN-008"
    name: "카드 생성 - 우선순위 설정"
    given: "카드 추가 폼이 열린 상태"
    when: "제목을 입력하고 우선순위 'High'를 선택한다"
    then: "카드에 High 우선순위 뱃지가 표시된다"
    examples:
      - input: { title: "긴급 버그 수정", priority: "High" }
        expect:
          cardTitle: "긴급 버그 수정"
          priorityBadge: "High"

  - id: "KANBAN-009"
    name: "카드 생성 - 마감일 설정"
    given: "카드 추가 폼이 열린 상태"
    when: "제목을 입력하고 마감일을 설정한다"
    then: "카드에 마감일이 표시된다"
    examples:
      - input: { title: "API 설계", dueDate: "2026-04-01" }
        expect:
          cardTitle: "API 설계"
          dueDate: "2026-04-01"

  - id: "KANBAN-010"
    name: "카드 생성 - 담당자 설정"
    given: "카드 추가 폼이 열린 상태"
    when: "제목을 입력하고 담당자를 입력한다"
    then: "카드에 담당자명이 표시된다"
    examples:
      - input: { title: "API 설계", assignee: "김개발" }
        expect:
          cardTitle: "API 설계"
          assignee: "김개발"

  - id: "KANBAN-011"
    name: "카드 생성 - 커버 이미지 URL"
    given: "카드 추가 폼이 열린 상태"
    when: "제목을 입력하고 커버 이미지 URL을 입력한다"
    then: "카드 상단에 커버 이미지가 표시된다"
    examples:
      - input: { title: "디자인 시안", coverImageUrl: "https://example.com/image.png" }
        expect:
          cardTitle: "디자인 시안"
          coverImageVisible: true

  # === 카드 인라인 편집 ===
  - id: "KANBAN-012"
    name: "카드 제목 인라인 편집"
    given: "제목이 'API 설계'인 카드가 표시된 상태"
    when: "카드 제목 'API 설계'를 클릭하고 'API 문서화'로 수정한다"
    then: "카드 제목이 'API 문서화'로 표시된다"
    examples:
      - input: { currentTitle: "API 설계", newTitle: "API 문서화" }
        expect:
          cardTitle: "API 문서화"

  - id: "KANBAN-013"
    name: "카드 우선순위 변경"
    given: "우선순위가 'High'인 카드가 표시된 상태"
    when: "우선순위를 'Low'로 변경한다"
    then: "우선순위 뱃지가 'Low'로 변경된다"
    examples:
      - input: { currentPriority: "High", newPriority: "Low" }
        expect:
          priorityBadge: "Low"

  - id: "KANBAN-043"
    name: "카드 설명 인라인 편집"
    given: "설명이 'REST 엔드포인트 정의'인 카드가 표시된 상태"
    when: "카드 설명 'REST 엔드포인트 정의'를 클릭하고 'GraphQL 스키마 정의'로 수정한 뒤 저장한다"
    then: "카드 설명이 'GraphQL 스키마 정의'로 표시된다"
    examples:
      - input: { currentDescription: "REST 엔드포인트 정의", newDescription: "GraphQL 스키마 정의" }
        expect:
          cardDescription: "GraphQL 스키마 정의"

  - id: "KANBAN-014"
    name: "카드 편집 취소"
    given: "제목이 'API 설계'인 카드를 인라인 편집 중인 상태"
    when: "Escape 키를 누른다"
    then: "편집이 취소되고 원래 제목 'API 설계'가 유지된다"
    examples:
      - input: { currentTitle: "API 설계", editedTitle: "임시 수정" }
        expect:
          cardTitle: "API 설계"

  # === 카드 삭제 ===
  - id: "KANBAN-015"
    name: "카드 삭제 확인"
    given: "카드 3개가 표시된 'Todo' 칼럼"
    when: "첫 번째 카드의 '삭제' 버튼을 클릭하고 확인 다이얼로그에서 '확인'을 클릭한다"
    then: "'Todo' 칼럼에 카드 2개가 표시된다"
    examples:
      - input: { confirmDelete: true }
        expect:
          cardCount: 2

  - id: "KANBAN-016"
    name: "카드 삭제 취소"
    given: "카드 3개가 표시된 'Todo' 칼럼"
    when: "첫 번째 카드의 '삭제' 버튼을 클릭하고 확인 다이얼로그에서 '취소'를 클릭한다"
    then: "'Todo' 칼럼에 카드 3개가 그대로 표시된다"
    examples:
      - input: { confirmDelete: false }
        expect:
          cardCount: 3

  # === 서브태스크 ===
  - id: "KANBAN-017"
    name: "서브태스크 추가"
    given: "서브태스크가 없는 카드가 표시된 상태"
    when: "서브태스크 'DB 스키마 작성'을 추가한다"
    then: "체크리스트에 'DB 스키마 작성' 항목이 표시된다"
    examples:
      - input: { subtask: "DB 스키마 작성" }
        expect:
          subtaskText: "DB 스키마 작성"
          subtaskCount: 1

  - id: "KANBAN-018"
    name: "서브태스크 진행률"
    given: "서브태스크 3개가 있는 카드가 표시된 상태"
    when: "서브태스크 2개를 체크한다"
    then: "진행률이 '2/3'으로 표시된다"
    examples:
      - input: { totalSubtasks: 3, checkedSubtasks: 2 }
        expect:
          progress: "2/3"

  - id: "KANBAN-019"
    name: "서브태스크 삭제"
    given: "서브태스크 'DB 스키마 작성'이 있는 카드"
    when: "'DB 스키마 작성' 서브태스크의 삭제 버튼을 클릭한다"
    then: "체크리스트에서 'DB 스키마 작성'이 제거된다"
    examples:
      - input: { deleteSubtask: "DB 스키마 작성" }
        expect:
          subtaskVisible: false

  - id: "KANBAN-020"
    name: "모든 서브태스크 완료"
    given: "서브태스크 3개가 있는 카드가 표시된 상태"
    when: "모든 서브태스크를 체크한다"
    then: "진행률이 '3/3'으로 표시된다"
    examples:
      - input: { totalSubtasks: 3, checkedSubtasks: 3 }
        expect:
          progress: "3/3"

  # === 드래그 & 드롭 ===
  - id: "KANBAN-021"
    name: "카드를 다른 칼럼으로 이동"
    given: "'Todo' 칼럼에 카드 2개, 'In Progress' 칼럼에 카드 0개가 표시된 칸반 보드"
    when: "'Todo'의 첫 번째 카드를 'In Progress'로 드래그한다"
    then: "'Todo'에 카드 1개, 'In Progress'에 카드 1개가 표시된다"
    examples:
      - input: { fromColumn: "Todo", toColumn: "In Progress" }
        expect:
          todoCardCount: 1
          inProgressCardCount: 1

  - id: "KANBAN-022"
    name: "칼럼 내 카드 순서 변경"
    given: "'Todo' 칼럼에 'A', 'B', 'C' 카드가 순서대로 표시된 상태"
    when: "'C' 카드를 'A' 카드 위로 드래그한다"
    then: "'Todo' 칼럼에 'C', 'A', 'B' 순서로 표시된다"
    examples:
      - input: { column: "Todo", dragCard: "C", dropBeforeCard: "A" }
        expect:
          cardOrder: ["C", "A", "B"]

  - id: "KANBAN-023"
    name: "드래그 후 새로고침 시 위치 유지"
    given: "카드를 'Todo'에서 'In Progress'로 이동한 상태"
    when: "페이지를 새로고침한다"
    then: "카드가 'In Progress' 칼럼에 그대로 표시된다"
    examples:
      - input: { movedCard: "API 설계", targetColumn: "In Progress" }
        expect:
          cardInColumn: "In Progress"

  # === 태그 관리 ===
  - id: "KANBAN-024"
    name: "태그 생성"
    given: "태그가 없는 상태"
    when: "새 태그 'Backend'를 생성하고 파란색을 선택한다"
    then: "태그 목록에 파란색 'Backend' 태그가 표시된다"
    examples:
      - input: { tagName: "Backend", tagColor: "blue" }
        expect:
          tagText: "Backend"
          tagVisible: true

  - id: "KANBAN-025"
    name: "카드에 태그 추가"
    given: "'Backend' 태그가 존재하고 카드가 표시된 상태"
    when: "카드에 'Backend' 태그를 추가한다"
    then: "카드에 'Backend' 태그 뱃지가 표시된다"
    examples:
      - input: { cardTitle: "API 설계", tag: "Backend" }
        expect:
          tagBadge: "Backend"
          tagBadgeVisible: true

  - id: "KANBAN-026"
    name: "카드에서 태그 제거"
    given: "'Backend' 태그가 붙은 카드가 표시된 상태"
    when: "카드에서 'Backend' 태그를 제거한다"
    then: "카드에서 'Backend' 태그 뱃지가 사라진다"
    examples:
      - input: { cardTitle: "API 설계", removeTag: "Backend" }
        expect:
          tagBadgeVisible: false

  - id: "KANBAN-027"
    name: "카드에 복수 태그 추가"
    given: "'Backend'와 'Urgent' 태그가 존재하고 카드가 표시된 상태"
    when: "카드에 'Backend'와 'Urgent' 태그를 모두 추가한다"
    then: "카드에 두 태그 뱃지가 모두 표시된다"
    examples:
      - input: { cardTitle: "API 설계", tags: ["Backend", "Urgent"] }
        expect:
          tagBadges: ["Backend", "Urgent"]

  # === 검색 ===
  - id: "KANBAN-028"
    name: "제목 검색 - 일치 결과"
    given: "제목이 'API 설계', 'DB 설계', '화면 디자인'인 카드 3개가 표시된 상태"
    when: "검색창에 'API'를 입력한다"
    then: "'API 설계' 카드만 표시된다"
    examples:
      - input: { searchQuery: "API" }
        expect:
          visibleCards: ["API 설계"]
          visibleCardCount: 1

  - id: "KANBAN-029"
    name: "제목 검색 - 검색어 삭제"
    given: "검색어 'API'가 입력되어 필터링된 상태"
    when: "검색어를 모두 삭제한다"
    then: "모든 카드가 다시 표시된다"
    examples:
      - input: { searchQuery: "" }
        expect:
          visibleCardCount: 3

  - id: "KANBAN-030"
    name: "제목 검색 - 결과 없음"
    given: "카드가 표시된 칸반 보드"
    when: "검색창에 'xyz123'을 입력한다"
    then: "'검색 결과가 없습니다' 메시지가 표시된다"
    examples:
      - input: { searchQuery: "xyz123" }
        expect:
          emptyMessage: "검색 결과가 없습니다"
          visibleCardCount: 0

  # === 필터 ===
  - id: "KANBAN-031"
    name: "우선순위 필터"
    given: "High 카드 1개, Medium 카드 2개가 표시된 상태"
    when: "우선순위 필터에서 'High'를 선택한다"
    then: "High 카드 1개만 표시된다"
    examples:
      - input: { priorityFilter: "High" }
        expect:
          visibleCardCount: 1

  - id: "KANBAN-032"
    name: "태그 필터"
    given: "'Backend' 태그가 붙은 카드 2개, 태그 없는 카드 1개가 표시된 상태"
    when: "태그 필터에서 'Backend'를 선택한다"
    then: "'Backend' 태그가 있는 카드 2개만 표시된다"
    examples:
      - input: { tagFilter: "Backend" }
        expect:
          visibleCardCount: 2

  - id: "KANBAN-033"
    name: "복합 필터 (AND)"
    given: "High+Backend 카드 1개, High+Frontend 카드 1개, Low+Backend 카드 1개가 표시된 상태"
    when: "우선순위 'High'와 태그 'Backend'를 동시에 선택한다"
    then: "두 조건을 모두 만족하는 카드 1개만 표시된다"
    examples:
      - input: { priorityFilter: "High", tagFilter: "Backend" }
        expect:
          visibleCardCount: 1

  - id: "KANBAN-034"
    name: "필터 해제"
    given: "우선순위 'High' 필터가 적용된 상태"
    when: "필터를 해제한다"
    then: "모든 카드가 다시 표시된다"
    examples:
      - input: { clearFilters: true }
        expect:
          visibleCardCount: 3

  - id: "KANBAN-045"
    name: "검색과 필터 동시 적용"
    given: "'API 설계(High)', 'API 문서화(Low)', 'DB 설계(High)' 카드 3개가 표시된 상태"
    when: "검색창에 'API'를 입력하고 우선순위 필터에서 'High'를 선택한다"
    then: "두 조건을 모두 만족하는 'API 설계' 카드 1개만 표시된다"
    examples:
      - input: { searchQuery: "API", priorityFilter: "High" }
        expect:
          visibleCards: ["API 설계"]
          visibleCardCount: 1

  # === 다크모드 ===
  - id: "KANBAN-035"
    name: "다크모드 토글"
    given: "라이트모드가 적용된 상태"
    when: "다크모드 토글을 클릭한다"
    then: "다크모드가 적용된다"
    examples:
      - input: { toggleDarkMode: true }
